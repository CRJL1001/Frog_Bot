services:
  frog-bot:
    build: .
    container_name: frog-bot
    env_file: .env
    environment:
      TZ: Europe/Paris
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bot-net

  postgres:
    image: postgres:16-alpine
    container_name: frog-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-botpassword}
      POSTGRES_DB: frogbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d frogbot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

networks:
  bot-net:
    driver: bridge